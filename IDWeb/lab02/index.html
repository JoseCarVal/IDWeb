<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Simple</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="card">
        <h2>Registro</h2>
        <form>
            <fieldset>
                <legend>Informacion Personal</legend>
                
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="codigo">Codigo (8 digitos):</label>
                <input type="number" id="codigo" required pattern="[0-9]{8}">

                <label for="email">Correo:</label>
                <input type="email" id="email" required>

                <label for="nacimiento">Nacimiento:</label>
                <input type="date" id="nacimiento" min="1950-01-01" max="2008-12-31" required>

                <label for="carrera">Carrera:</label>
                <select id="carrera" required>
                    <option value="">Seleccione</option>
                    <option value="sistemas">Sistemas</option>
                    <option value="industrial">Industrial</option>
                </select>

                <label>Turno:</label>
                <div>
                    <label><input type="radio" name="turno" value="dia" required> Día</label>
                    <label><input type="radio" name="turno" value="noche"> Noche</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Información de la Cuenta</legend>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}">

                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios"></textarea>

                <div>
                    <label>
                        <input type="checkbox" id="terminos" required> Acepto términos
                    </label>
                </div>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>
